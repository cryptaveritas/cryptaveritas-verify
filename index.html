<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptaVeritas — Verify Cryptographic Integrity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--surface:#111113;--border:#27272a;--border2:#3f3f46;
  --text:#fafafa;--muted:#a1a1aa;--hint:#71717a;
  --accent:#06b6d4;--green:#22c55e;--red:#ef4444;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}

.nav{
  background:rgba(9,9,11,0.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 32px;height:88px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo img{width:96px;height:96px;object-fit:contain}
.nav-logo-text{font-family:var(--sans);font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.5px}
.nav-logo-text em{color:var(--accent);font-style:normal}
.nav-right{display:flex;align-items:center;gap:20px}
.nav-right a{font-family:var(--mono);font-size:10px;color:var(--hint);letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.nav-right a:hover{color:var(--text)}
.nav-badge{font-family:var(--mono);font-size:10px;padding:4px 10px;border:1px solid var(--accent);color:var(--accent);letter-spacing:1px}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}

.card{width:100%;max-width:540px;background:var(--surface);border:1px solid var(--border);padding:40px}

.card-header{margin-bottom:28px}
.card-title{
  font-size:22px;font-weight:700;letter-spacing:-0.5px;
  color:var(--text);margin-bottom:8px;
}
.card-title em{color:var(--accent);font-style:normal}
.card-subtitle{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.card-divider{height:1px;background:var(--border)}

.example-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:var(--accent);
  background:transparent;border:1px solid var(--border2);
  padding:5px 12px;cursor:pointer;margin-top:16px;
  transition:border-color 0.2s;
}
.example-btn:hover{border-color:var(--accent)}

.field{margin-bottom:20px}
.field label{
  display:block;font-family:var(--mono);font-size:11px;
  letter-spacing:2px;text-transform:uppercase;
  color:#c9d1d9;margin-bottom:8px;font-weight:500;
}
.field input,.field textarea{
  width:100%;background:#0d1117;
  border:1px solid #444c56;
  color:#e6edf3;
  font-family:var(--mono);font-size:12px;
  padding:11px 14px;outline:none;transition:border-color 0.2s;resize:vertical;
}
.field input::placeholder,.field textarea::placeholder{color:#6e7681}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:90px}

.btn{
  width:100%;padding:14px;background:var(--accent);color:#000;border:none;
  cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;transition:opacity 0.2s;margin-top:4px;
}
.btn:hover{opacity:0.85}

.result{margin-top:24px;padding:20px 24px;border:1px solid var(--border);display:none}
.result.ok{background:rgba(34,197,94,0.06);border-color:var(--green)}
.result.fail{background:rgba(239,68,68,0.06);border-color:var(--red)}
.result-status{
  font-family:var(--mono);font-size:18px;font-weight:700;
  margin-bottom:8px;display:flex;align-items:center;gap:10px;
}
.result.ok .result-status{color:var(--green)}
.result.fail .result-status{color:var(--red)}
.result-desc{font-size:13px;color:var(--muted);line-height:1.6}

.footer{
  border-top:1px solid var(--border);padding:0 32px;height:40px;
  display:flex;align-items:center;justify-content:space-between;
}
.footer-left{font-family:var(--mono);font-size:9px;color:var(--hint);letter-spacing:1px}
.footer-right{display:flex;gap:20px}
.footer-right a{font-family:var(--mono);font-size:9px;color:var(--hint);text-decoration:none}
.footer-right a:hover{color:var(--accent)}

@media(max-width:500px){.nav-right a{display:none}.card{padding:24px}}
</style>
</head>

function loadExample(){

async function sha256hex(msg){
  const data=new TextEncoder().encode(msg);
  const buf=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function toStrict(val,seen,depth){
  seen=seen||new Set();depth=depth||0;
  if(depth>20)throw new Error('Depth limit');
  if(val===null)return 'null';
  if(val===undefined)throw new Error('undefined');
  if(typeof val!=='object')return JSON.stringify(val);
  if(seen.has(val))throw new Error('Circular');
  seen.add(val);
  var r;
  if(Array.isArray(val)){r='['+val.map(function(i){return toStrict(i,seen,depth+1);}).join(',')+']';}
  else{var keys=Object.keys(val).sort();r='{'+keys.map(function(k){return JSON.stringify(k)+':'+toStrict(val[k],seen,depth+1);}).join(',')+'}'}
  seen.delete(val);return r;
}
async function doVerify(){
  var hash=document.getElementById('hash').value.trim();
  var signalRaw=document.getElementById('signal').value.trim();
  var salt=document.getElementById('salt').value.trim();
  var result=document.getElementById('result');
  var status=document.getElementById('result-status');
  var desc=document.getElementById('result-desc');
  try{
    if(!/^[0-9a-fA-F]{64}$/.test(hash))throw new Error('Invalid hash format — must be 64 hex characters');
    if(!/^[0-9a-fA-F]{64}$/.test(salt))throw new Error('Invalid salt format — must be 64 hex characters');
    var signal=JSON.parse(signalRaw);
    var strictData=toStrict(signal);
    var payload='cryptasignals:v1|signal|'+strictData+'|'+salt;
    var computed=await sha256hex(payload);
    if(computed===hash.toLowerCase()){
      result.className='result ok';
      status.innerHTML='✅ VERIFIED';
      desc.innerHTML='The revealed signal exactly matches the original commitment.<br><span style="color:#3f3f46;font-size:11px;font-family:var(--mono)">Computed: '+computed+'</span>';
    }else{
      result.className='result fail';
      status.innerHTML='❌ INVALID';
      desc.innerHTML='Hash does not match. The signal may have been altered after commitment.<br><span style="color:#3f3f46;font-size:11px;font-family:var(--mono)">Expected: '+hash.toLowerCase()+'<br>Computed: '+computed+'</span>';
    }
  }catch(e){
    result.className='result fail';
    status.innerHTML='⚠️ ERROR';
    desc.textContent=e.message;
  }
  result.style.display='block';
}
