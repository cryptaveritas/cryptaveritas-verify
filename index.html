<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>CryptaVeritas Verifier</title><style>body{font-family:monospace;max-width:700px;margin:40px auto;padding:20px;background:#0d1117;color:#c9d1d9}h1{color:#58a6ff}input,textarea{width:100%;padding:8px;margin:6px 0 14px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;box-sizing:border-box}button{background:#238636;color:white;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:14px}#result{margin-top:20px;padding:16px;border-radius:6px;display:none}.ok{background:#0f2d1a;border:1px solid #238636;color:#3fb950}.fail{background:#2d0f0f;border:1px solid #da3633;color:#f85149}label{color:#8b949e;font-size:13px}</style></head><body><h1>CryptaVeritas Verifier</h1><p>Verify that a trading signal was not tampered with after commitment.</p><label>Precommit Hash (64 hex chars)</label><input id="hash" placeholder="e.g. a3f1c2..."><label>Signal JSON</label><textarea id="signal" rows="6"></textarea><label>Salt (64 hex chars)</label><input id="salt" placeholder="e.g. b4e2d1..."><button onclick="doVerify()">Verify</button><div id="result"></div><script>async function sha256hex(msg){const data=new TextEncoder().encode(msg);const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}function toStrict(val,seen,depth){seen=seen||new Set();depth=depth||0;if(depth>20)throw new Error('Depth limit');if(val===null)return 'null';if(val===undefined)throw new Error('undefined');if(typeof val!=='object')return JSON.stringify(val);if(seen.has(val))throw new Error('Circular');seen.add(val);var r;if(Array.isArray(val)){r='['+val.map(function(i){return toStrict(i,seen,depth+1);}).join(',')+']';}else{var keys=Object.keys(val).sort();r='{'+keys.map(function(k){return JSON.stringify(k)+':'+toStrict(val[k],seen,depth+1);}).join(',')+'}'}seen.delete(val);return r;}async function doVerify(){var hash=document.getElementById('hash').value.trim();var signalRaw=document.getElementById('signal').value.trim();var salt=document.getElementById('salt').value.trim();var result=document.getElementById('result');try{if(!/^[0-9a-fA-F]{64}$/.test(hash))throw new Error('Invalid hash');if(!/^[0-9a-fA-F]{64}$/.test(salt))throw new Error('Invalid salt');var signal=JSON.parse(signalRaw);var strictData=toStrict(signal);var payload='cryptasignals:v1|signal|'+strictData+'|'+salt;var computed=await sha256hex(payload);if(computed===hash.toLowerCase()){result.className='ok';result.innerHTML='<b>VERIFIED</b> - Hash matches. Signal was not tampered with.';}else{result.className='fail';result.innerHTML='<b>INVALID</b> - Hash does not match.';}}catch(e){result.className='fail';result.innerHTML='<b>ERROR</b>: '+e.message;}result.style.display='block';}</script></body></html>
